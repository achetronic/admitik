name: Bundle Kubernetes manifests

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example v1.10.0. The tag has to exist'
        required: true
      from_master:
        description: 'Build from master instead of from the tag. Only to retry a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Release Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Resolve what to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FROM_MASTER: ${{ inputs.from_master }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            version="${RELEASE_TAG}"
            from_master=false
          else
            version="${INPUT_VERSION}"
            from_master="${INPUT_FROM_MASTER}"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${version}' is not a version like v1.2.3" >&2
            exit 1
          fi

          ref="${version}"
          if [ "${from_master}" = "true" ]; then
            ref="master"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Check the tag exists
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION}" > /dev/null; then
            echo "The tag ${VERSION} does not exist. Publish the release first: the release is what creates the tag." >&2
            exit 1
          fi

      - name: Read Go version from go.mod
        id: read_go_version
        run: |
          go_version_raw=$(grep "^go " go.mod | awk '{print $2}')
          echo "go_version=${go_version_raw}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ steps.read_go_version.outputs.go_version }}'
          check-latest: true

      - id: build
        name: Build manifests bundle
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          export IMG="ghcr.io/$GITHUB_REPOSITORY:${VERSION}"
          make build-installer

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.target.outputs.version }}
        run: gh release upload "${VERSION}" dist/install.yaml --clobber
