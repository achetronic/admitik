name: Release Charts

on:
  workflow_dispatch:

  # Ref: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release
  release:
    types: [ published ]

permissions:
  # The chart is published as an OCI artifact in the packages of this repository
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Check the release tag matches the chart
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk '/^version:/ {print $2}' charts/admitik/Chart.yaml)"
          app_version="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/admitik/Chart.yaml)"

          if [ "${version}" != "${tag}" ] || [ "${app_version}" != "${tag}" ]; then
            echo "The release is ${tag} but the chart says version ${version} and appVersion ${app_version}" >&2
            exit 1
          fi

      - name: Check the chart CRDs are the generated ones
        run: |
          if ! diff -r config/crd/bases charts/admitik/crds; then
            echo "The CRDs of the chart differ from config/crd/bases. Run 'make chart-crds' and commit the result." >&2
            exit 1
          fi

      - name: Package the chart
        run: helm package charts/admitik --destination dist

      - name: Push the chart to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

          helm push dist/admitik-*.tgz "oci://ghcr.io/${{ github.repository }}/charts"
