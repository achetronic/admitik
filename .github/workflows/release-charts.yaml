name: Release Charts

on:
  workflow_dispatch:

  # Ref: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release
  release:
    types: [ published ]

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check the release tag matches the chart
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk '/^version:/ {print $2}' charts/admitik/Chart.yaml)"
          app_version="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/admitik/Chart.yaml)"

          if [ "${version}" != "${tag}" ] || [ "${app_version}" != "${tag}" ]; then
            echo "The release is ${tag} but the chart says version ${version} and appVersion ${app_version}" >&2
            exit 1
          fi

      - name: Check the chart CRDs are the generated ones
        run: |
          if ! diff -r config/crd/bases charts/admitik/crds; then
            echo "The CRDs of the chart differ from config/crd/bases. Run 'make chart-crds' and commit the result." >&2
            exit 1
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          packages_with_index: true
          pages_branch: helm-registry
          config: .github/chart-releaser-config.yaml
        env:
          CR_OWNER: "$GITHUB_REPOSITORY_OWNER"
          CR_GIT_REPO: admitik
          CR_SKIP_EXISTING: true
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
