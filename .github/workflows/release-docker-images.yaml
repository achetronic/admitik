name: Build Docker image

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example v1.10.0. The tag has to exist'
        required: true
      from_master:
        description: 'Build from master instead of from the tag. Only to retry a release'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve what to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FROM_MASTER: ${{ inputs.from_master }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            version="${RELEASE_TAG}"
            from_master=false
          else
            version="${INPUT_VERSION}"
            from_master="${INPUT_FROM_MASTER}"
          fi

          if ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${version}' is not a version like v1.2.3" >&2
            exit 1
          fi

          ref="${version}"
          if [ "${from_master}" = "true" ]; then
            ref="master"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Check the tag exists
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION}" > /dev/null; then
            echo "The tag ${VERSION} does not exist. Publish the release first: the release is what creates the tag." >&2
            exit 1
          fi

      - name: Read Go version from go.mod
        id: read_go_version
        run: |
          go_version_raw=$(grep "^go " go.mod | awk '{print $2}')
          echo "go_version=${go_version_raw}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '${{ steps.read_go_version.outputs.go_version }}'

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push Docker images
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          export IMG="ghcr.io/$GITHUB_REPOSITORY:${VERSION}"

          if grep -q '^docker-buildx:' Makefile; then
            make docker-buildx
          else
            make docker-build
            make docker-push
          fi
